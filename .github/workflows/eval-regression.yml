name: Eval Regression Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "agents/**"
      - "eval/**"
      - "packages/shared-types/**"
      - "docker-compose.yml"
  push:
    branches: [main]

jobs:
  eval-regression:
    name: Eval Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        run: |
          cd eval
          pip install -r requirements.txt || pip install deepeval ragas pytest

      - name: Run eval harness on golden set
        run: |
          cd eval
          python -m pytest harness/ --golden-set=datasets/golden/ --report=reports/
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Check regression thresholds
        run: |
          cd eval
          python harness/check_regression.py --report=reports/latest.json
        continue-on-error: true

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/
          retention-days: 30
