# Baseline pipeline — mirrors the existing team's setup as described in the PRD.
#
# Stack: LlamaParse → ParentChild chunking → Gemini text-embedding-large (3072d)
#        → Qdrant (local) → Dense retrieval → no reranker → Gemini 2.0 Flash
#
# Requirements (env vars — set in .env):
#   LLAMA_CLOUD_API_KEY   — LlamaParse cloud API
#   GOOGLE_API_KEY        — Gemini embedding + generation

pipeline:
  name: baseline_v1

  parser:
    name: llamaparse
    result_type: markdown
    language: vi

  chunker:
    name: parent_child
    parent_chunk_size: 1000   # characters; large enough for full policy paragraphs
    child_chunk_size: 300     # characters; small enough for precise embedding
    child_overlap: 30

  embedder:
    name: gemini
    model: models/text-embedding-large-exp-03-07
    dim: 3072
    task_type: RETRIEVAL_DOCUMENT

  vector_store:
    name: qdrant
    mode: local
    path: ./data/qdrant_baseline
    collection: hcns_baseline
    dim: 3072
    distance: Cosine

  retriever:
    name: dense
    top_k: 5

  reranker:
    name: noop

  generator:
    name: gemini
    model: gemini-2.0-flash
    temperature: 0.1
    max_output_tokens: 1024

eval:
  golden_set: data/golden/mini_v1.json
  top_k: 5
  seed: 42
  output_dir: reports
