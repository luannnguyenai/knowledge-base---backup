[project]
name = "hcns-eval"
version = "0.1.0"
description = "HC-NS pipeline-agnostic evaluation framework: golden set, metrics, judge, harness, report, sweep, regression gate"
requires-python = ">=3.11"
dependencies = [
    "hcns-shared",
    "hcns-agents",
    "openai>=1.30",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[project.scripts]
ragbench = "hcns_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcns_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
