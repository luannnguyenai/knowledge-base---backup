[project]
name = "hcns-backend"
version = "0.1.0"
description = "HC-NS backend component layers: parsing, chunking, embedding, retrieval, reranking"
requires-python = ">=3.11"
dependencies = [
    "hcns-shared",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    # Real component backends (optional at runtime; imported lazily)
    "llama-parse>=0.5",
    "google-genai>=1.0",
    "qdrant-client>=1.9",
    "FlagEmbedding>=1.2",
    "cohere>=5.0",
    "rank-bm25>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcns_backend"]
