[project]
name = "hcns-agents"
version = "0.1.0"
description = "HC-NS LangGraph agent: state graph, nodes, generators, prompts, and the baseline static pipeline"
requires-python = ">=3.11"
dependencies = [
    "hcns-shared",
    "hcns-backend",
    "langgraph>=0.3",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcns_agents"]
